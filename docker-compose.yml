services:
  # ── PostgreSQL database ────────────────────────────────────────────────────
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ph_advisor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ph_advisor}
    # Port is NOT exposed to the host by default (security best practice).
    # Uncomment the next two lines for local development debugging:
    # ports:
    #   - "${POSTGRES_PORT:-5182}:5432"
    volumes:
      # Postgres 18+ images store the cluster in a major-version subdirectory
      # (/var/lib/postgresql/18/docker), so the PARENT is what gets mounted —
      # not /var/lib/postgresql/data as on 17 and earlier. A PG 18 container
      # refuses to start if it finds an older cluster at the mount root, so a
      # major upgrade always means a new volume + dump/restore (or pg_upgrade).
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ph_advisor}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Redis (message broker + result backend) ────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Port is NOT exposed to the host by default (security best practice).
    # Uncomment the next two lines for local development debugging:
    # ports:
    #   - "${REDIS_PORT:-5183}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── MCP server (PSE data tools) ────────────────────────────────────────────
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      DRAGONFI_BASE_URL: ${DRAGONFI_BASE_URL:-https://api.dragonfi.ph/api/v2}
      PSE_EDGE_BASE_URL: ${PSE_EDGE_BASE_URL:-https://edge.pse.com.ph}
      TRADINGVIEW_SCANNER_URL: ${TRADINGVIEW_SCANNER_URL:-https://scanner.tradingview.com/philippines/scan}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-15}
      TIMEZONE: ${TIMEZONE:-Asia/Manila}
      # ── Analysis thresholds (mirrored so the in-server services use the
      #    same configuration as the rest of the stack) ──────────────────────
      TREND_UP_THRESHOLD: ${TREND_UP_THRESHOLD:-5}
      TREND_DOWN_THRESHOLD: ${TREND_DOWN_THRESHOLD:--5}
      SPIKE_STD_MULTIPLIER: ${SPIKE_STD_MULTIPLIER:-3}
      SPIKE_MIN_ABS_RETURN: ${SPIKE_MIN_ABS_RETURN:-0.05}
      HIGH_VOLATILITY_THRESHOLD: ${HIGH_VOLATILITY_THRESHOLD:-0.03}
      OVERVALUATION_MULTIPLIER: ${OVERVALUATION_MULTIPLIER:-1.3}
      DISTRESS_MULTIPLIER: ${DISTRESS_MULTIPLIER:-0.7}
      CATALYST_YIELD_THRESHOLD: ${CATALYST_YIELD_THRESHOLD:-3.0}
      CATALYST_RANGE_PCT: ${CATALYST_RANGE_PCT:-65}
      CATALYST_DAY_CHANGE_PCT: ${CATALYST_DAY_CHANGE_PCT:-0.5}
      CATALYST_NEAR_HIGH_PCT: ${CATALYST_NEAR_HIGH_PCT:-5}
    # Exposed on the host so external MCP clients (Claude Desktop, IDEs,
    # curl, etc.) can connect at http://<host>:${MCP_HOST_PORT:-5184}/mcp/
    ports:
      - "${MCP_HOST_PORT:-5184}:8000"
    entrypoint: ["ph-advisor-mcp"]

  # ── Flask web UI ───────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp:
        condition: service_started
    ports:
      - "${WEB_PORT:-5180}:5000"
    environment: &shared-env
      # ── LLM (provider-agnostic: openai + anthropic) ───────────────────────
      # At least one provider key is required; the app fails fast if the
      # chosen provider's key is missing (so neither is hard-required here).
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-}
      # Per-provider tier model IDs (empty → code defaults; OpenAI tiers also
      # fall back to OPENAI_MODEL / OPENAI_MINI_MODEL below)
      OPENAI_MODEL_LARGE: ${OPENAI_MODEL_LARGE:-}
      OPENAI_MODEL_MEDIUM: ${OPENAI_MODEL_MEDIUM:-}
      OPENAI_MODEL_SMALL: ${OPENAI_MODEL_SMALL:-}
      ANTHROPIC_MODEL_LARGE: ${ANTHROPIC_MODEL_LARGE:-}
      ANTHROPIC_MODEL_MEDIUM: ${ANTHROPIC_MODEL_MEDIUM:-}
      ANTHROPIC_MODEL_SMALL: ${ANTHROPIC_MODEL_SMALL:-}
      # Per-agent overrides — each a [provider:]tier spec
      LLM_CONSOLIDATOR: ${LLM_CONSOLIDATOR:-}
      LLM_PORTFOLIO: ${LLM_PORTFOLIO:-}
      LLM_PRICE_AGENT: ${LLM_PRICE_AGENT:-}
      LLM_DIVIDEND_AGENT: ${LLM_DIVIDEND_AGENT:-}
      LLM_MOVEMENT_AGENT: ${LLM_MOVEMENT_AGENT:-}
      LLM_VALUATION_AGENT: ${LLM_VALUATION_AGENT:-}
      LLM_CONTROVERSY_AGENT: ${LLM_CONTROVERSY_AGENT:-}
      LLM_SENTIMENT_AGENT: ${LLM_SENTIMENT_AGENT:-}
      # Legacy aliases (fallbacks for the OpenAI tiers above)
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_MINI_MODEL: ${OPENAI_MINI_MODEL:-gpt-4o-mini}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0.0}
      # ── MCP server (required — the advisor has no in-process fallback) ──
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://mcp:8000/mcp/}
      # ── Web search (optional) ─────────────────────────────────────────────
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TAVILY_MAX_RESULTS: ${TAVILY_MAX_RESULTS:-5}
      TAVILY_SEARCH_DEPTH: ${TAVILY_SEARCH_DEPTH:-basic}
      # ── Database — always Postgres inside Docker ──────────────────────────
      DB_BACKEND: postgres
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-ph_advisor}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ph_advisor}
      # ── Redis ─────────────────────────────────────────────────────────────
      REDIS_URL: redis://redis:6379/0
      # ── API base URLs ─────────────────────────────────────────────────────
      DRAGONFI_BASE_URL: ${DRAGONFI_BASE_URL:-https://api.dragonfi.ph/api/v2}
      PSE_EDGE_BASE_URL: ${PSE_EDGE_BASE_URL:-https://edge.pse.com.ph}
      TRADINGVIEW_SCANNER_URL: ${TRADINGVIEW_SCANNER_URL:-https://scanner.tradingview.com/philippines/scan}
      # ── HTTP ──────────────────────────────────────────────────────────────
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-15}
      # ── Timezone ──────────────────────────────────────────────────────────
      TIMEZONE: ${TIMEZONE:-Asia/Manila}
      # ── Output directory (bind-mounted to host) ───────────────────────────
      OUTPUT_DIR: /app/output
      # ── Microsoft Entra ID (passkey / OIDC login) ─────────────────────────
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-common}
      ENTRA_REDIRECT_PATH: ${ENTRA_REDIRECT_PATH:-/auth/callback}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-ph-stocks-advisor-change-me-in-production}
      # ── Google OAuth2 (social login) ──────────────────────────────────────
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_PATH: ${GOOGLE_REDIRECT_PATH:-/auth/google/callback}
      # ── Passkeys / WebAuthn (off unless WEBAUTHN_RP_ID is set) ─────────────
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-PH Stock Advisor AI}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:5180}
      # ── Langfuse (optional) ───────────────────────────────────────────────
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      LANGFUSE_TRACING_ENABLED: ${LANGFUSE_TRACING_ENABLED:-true}
      LANGFUSE_TRACING_ENVIRONMENT: ${LANGFUSE_TRACING_ENVIRONMENT:-development}
      # ── Gunicorn tuning ───────────────────────────────────────────────────
      WEB_WORKERS: ${WEB_WORKERS:-4}
      WEB_WORKER_CLASS: ${WEB_WORKER_CLASS:-ph_stocks_advisor.web.worker.GeventWorkerNoSSL}
      WEB_WORKER_CONNECTIONS: ${WEB_WORKER_CONNECTIONS:-1000}
      WEB_TIMEOUT: ${WEB_TIMEOUT:-120}
      # ── Connection pools ─────────────────────────────────────────────────
      PG_POOL_MIN: ${PG_POOL_MIN:-2}
      PG_POOL_MAX: ${PG_POOL_MAX:-5}
      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-10}
    volumes:
      - ./output:/app/output
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    entrypoint: ["ph-advisor-web"]
    command: ["--host", "0.0.0.0", "--port", "5000"]

  # ── Celery worker (runs analyses in the background) ────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp:
        condition: service_started
    environment:
      <<: *shared-env
    volumes:
      - ./output:/app/output
    entrypoint: ["celery"]
    command: ["-A", "ph_stocks_advisor.web.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=${CELERY_CONCURRENCY:-4}", "--pool=prefork"]

  # ── PH Stocks Advisor CLI (one-shot analysis) ─────────────────────────────
  advisor:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      mcp:
        condition: service_started
    environment:
      <<: *shared-env
    volumes:
      - ./output:/app/output
    # Default: analyse TEL. Override with:
    #   docker compose run --rm advisor SM BDO --pdf
    command: ["TEL"]

  # ── SQLAdmin (database admin panel) ────────────────────────────────────────
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ADMIN_PORT:-5181}:8085"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ph_advisor}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ph_advisor}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:-sqladmin-dev-secret-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    restart: unless-stopped

volumes:
  # Any pre-18 `pgdata` volume is deliberately left undeclared: it still exists
  # on disk, but `docker compose down -v` will no longer delete it.
  pgdata18:
