[project]
name = "ph-stocks-advisor"
version = "2.1.7"
description = "Agentic AI Philippine Stock Market Advisor"
requires-python = ">=3.14"
dependencies = [
    "langgraph>=1.2",
    "langchain>=1.3",
    "langchain-openai>=1.4",
    "langchain-anthropic>=1.5",
    "langchain-core>=1.5",
    "pydantic>=2.13",
    "python-dotenv>=1.2",
    "fpdf2>=2.8",
    "tavily-python>=0.7",
    "pandas>=3.0",
    "numpy>=2.5",
    "requests>=2.34",
    "flask>=3.1",
    "celery[redis]>=5.6",
    "redis>=6.4",
    "msal>=1.37",
    "webauthn>=3.0",
    "flask-session>=0.8",
    "gunicorn>=26.0",
    "gevent>=26.5",
    # mcp 2.0 removed/moved mcp.server.fastmcp — migrate deliberately, not via
    # a surprise CI resolve. Lift the ceiling when the server is ported.
    "mcp>=1.28,<2",
    "langfuse>=4.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.4",
    "ruff>=0.15",
    "pyright>=1.1",
]
postgres = [
    "psycopg2-binary>=2.9",
]

[project.scripts]
ph-advisor = "ph_stocks_advisor.main:main"
ph-advisor-pdf = "ph_stocks_advisor.export.pdf:main"
ph-advisor-html = "ph_stocks_advisor.export.html:main"
ph-advisor-web = "ph_stocks_advisor.web.app:main"
ph-advisor-mcp = "ph_stocks_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["ph_stocks_advisor*", "ph_stocks_mcp*"]

[tool.setuptools.package-data]
ph_stocks_advisor = [
    "web/templates/**/*.html",
    "web/static/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that make real LLM / network calls (deselect with '-m \"not integration\"')",
]

# ── Ruff ──────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (security)
]
ignore = [
    "S101", # assert used in tests is fine
    "S105", # hardcoded password false positives in config defaults
    "S106", # same
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]

# ── Pyright ────────────────────────────────────────────────────────────────
[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
include = ["ph_stocks_advisor/", "ph_stocks_mcp/", "tests/"]
exclude = ["admin/"]
