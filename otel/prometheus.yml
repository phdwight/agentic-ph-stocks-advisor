global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # OTel Collector self-telemetry
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  # App metrics exported by the OTel Collector's Prometheus exporter
  - job_name: ph-advisor-apps
    static_configs:
      - targets: ["otel-collector:8889"]
