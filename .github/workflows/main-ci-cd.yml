# CI/CD pipeline for the main (production) branch.
# Runs the same quality gates as develop, then deploys to one or both targets:
#   - Azure Container Apps  (when AZURE_CREDENTIALS secret is set)
#   - Docker Compose via SSH (when DEPLOY_SSH_KEY secret is set)

name: CI/CD — Main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # manual re-run (bump is skipped; build still publishes)

concurrency:
  group: cicd-main-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  UV_CACHE_DIR: /tmp/.uv-cache
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Lint & type-check ────────────────────────────────────────────────────
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright type check
        uses: jakebailey/pyright-action@v3
        with:
          python-path: .venv/bin/python
        timeout-minutes: 5

  # ── Unit tests (no secrets, fully mocked) ────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev --extra dev

      - name: Run unit tests
        run: uv run pytest tests/ -v -m "not integration" --tb=short
        env:
          LANGFUSE_TRACING_ENABLED: "false"

  # ── Integration tests (real LLM calls, requires secrets) ─────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [quality, unit-tests]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev --extra dev

      - name: Run integration tests
        run: |
          uv run pytest tests/ -v -m "integration" --tb=short || code=$?; if [ "${code:-0}" -eq 5 ]; then echo "No integration tests found — skipping."; exit 0; else exit "${code:-0}"; fi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
          LANGFUSE_TRACING_ENABLED: "true"
          LANGFUSE_TRACING_ENVIRONMENT: "ci"

  # ── Detect which image inputs changed ─────────────────────────────────────
  # Gates the image builds so a merge only rebuilds an image when files that
  # actually affect *that* image change. The app build context is `.` with a
  # strict .dockerignore, so only its real build inputs are listed here; the
  # admin image is built from ./admin, so it tracks only that directory.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      admin: ${{ steps.filter.outputs.admin }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'Dockerfile'
              - '.dockerignore'
              - 'requirements.txt'
              - 'pyproject.toml'
              - 'ph_stocks_advisor/**'
              - 'ph_stocks_mcp/**'
            admin:
              - 'admin/**'
            deploy:
              - 'docker-compose.prod.yml'

  # ── Auto version bump (tag-driven) ────────────────────────────────────────
  # Version source of truth is GIT TAGS (vX.Y.Z). On every push to main that
  # will actually rebuild the app image, compute:
  #     next = max(latest vX.Y.Z with patch+1, pyproject.toml version as floor)
  # and push ONLY an annotated tag — never a commit. Tags are not branch-
  # protected, so this works with the stock GITHUB_TOKEN + contents: write.
  #
  # Gated on `changes.app` so every tag has a matching :X.Y.Z image in GHCR
  # (a docs-only merge rebuilds nothing, so it must not mint a phantom tag).
  #
  # For a minor/major release, raise the floor in pyproject.toml (e.g. 2.2.0)
  # before merging — the floor wins over patch+1.
  bump:
    name: Bump Version & Tag
    runs-on: ubuntu-latest
    needs: [quality, unit-tests, integration-tests, changes]
    if: >
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.changes.outputs.app == 'true'
    permissions:
      contents: write
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      sha: ${{ steps.next.outputs.sha }}
      created: ${{ steps.tag.outputs.created }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # need full history + tags to find the latest version
          fetch-tags: true

      - name: Compute next version
        id: next
        run: |
          set -euo pipefail
          # Floor: the committed pyproject.toml version (seeds the first
          # release, and lets a human request a minor/major bump).
          floor=$(awk -F'"' '/^version[[:space:]]*=/{print $2; exit}' pyproject.toml)
          if ! [[ "$floor" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::pyproject.toml version '$floor' is not X.Y.Z"
            exit 1
          fi

          # Latest existing vX.Y.Z tag, patch incremented.
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' \
                   | sed 's/^v//' \
                   | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
                   | sort -V | tail -1 || true)
          if [ -n "$latest" ]; then
            IFS=. read -r ma mi pa <<< "$latest"
            candidate="$ma.$mi.$((pa + 1))"
          else
            candidate="$floor"   # no tags yet: seed from the version file
          fi

          # next = max(candidate, floor)
          version=$(printf '%s\n%s\n' "$candidate" "$floor" | sort -V | tail -1)

          echo "floor=$floor  latest_tag=${latest:-none}  candidate=$candidate  -> next=$version"
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "sha=${{ github.sha }}"
          } >> "$GITHUB_OUTPUT"

      - name: Create and push annotated tag
        id: tag
        run: |
          set -euo pipefail
          tag="${{ steps.next.outputs.tag }}"
          # Idempotent: never fail a re-run if the tag already exists.
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null \
             || git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::notice::Tag $tag already exists — skipping tag creation"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag" "${{ github.sha }}"
          git push origin "$tag"     # ONLY the tag — no commit to main
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Created and pushed $tag at ${{ github.sha }}"

  # ── Build & push Docker images to GHCR ────────────────────────────────────
  # The job runs only if at least one image's inputs changed; within it, the
  # app and admin builds are each gated independently so only the changed
  # image is rebuilt and pushed.
  build-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [quality, unit-tests, integration-tests, changes, bump]
    # Runs when the tests passed and bump either succeeded or was skipped
    # (admin-only change, PR, manual dispatch) — never blocked by a skipped bump.
    if: >
      !cancelled()
      && needs.quality.result == 'success'
      && needs.unit-tests.result == 'success'
      && (needs.bump.result == 'success' || needs.bump.result == 'skipped')
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && (needs.changes.outputs.app == 'true' || needs.changes.outputs.admin == 'true')
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_BASE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Bake the bumped version into the artifact's version source BEFORE
      # building, so the image reports exactly the version its tag claims.
      # (The app reads pyproject.toml at runtime — see web/app.py.)
      - name: Bake version into pyproject.toml
        if: needs.bump.outputs.version != ''
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          from pathlib import Path
          target = os.environ["VERSION"]
          path = Path("pyproject.toml")
          text, n = re.subn(
              r'^(version\s*=\s*)"[^"]+"',
              lambda m: f'{m.group(1)}"{target}"',
              path.read_text(), count=1, flags=re.MULTILINE,
          )
          if n != 1:
              raise SystemExit("Failed to locate the version line in pyproject.toml")
          path.write_text(text)
          PY
          echo "Baked version into pyproject.toml:"
          grep -m1 '^version' pyproject.toml
        env:
          VERSION: ${{ needs.bump.outputs.version }}

      - name: Docker meta (app)
        id: meta-app
        if: needs.changes.outputs.app == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}
          tags: |
            type=sha
            type=raw,value=latest
            type=raw,value=${{ needs.bump.outputs.version }},enable=${{ needs.bump.outputs.version != '' }}

      - name: Build & push app image
        if: needs.changes.outputs.app == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker meta (admin)
        id: meta-admin
        if: needs.changes.outputs.admin == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}-admin
          tags: |
            type=sha
            type=raw,value=latest
            type=raw,value=${{ needs.bump.outputs.version }},enable=${{ needs.bump.outputs.version != '' }}

      - name: Build & push admin image
        if: needs.changes.outputs.admin == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./admin
          file: admin/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-admin.outputs.tags }}
          labels: ${{ steps.meta-admin.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Azure Container Apps ────────────────────────────────────────
      # ── Verify the published artifact carries the version its tag claims ──
      # Pulls the freshly pushed :X.Y.Z image and asks the app for the version
      # it reports at runtime. Catches bake/off-by-one regressions immediately.
      - name: Verify published image version matches the tag
        if: needs.changes.outputs.app == 'true' && needs.bump.outputs.version != ''
        run: |
          set -euo pipefail
          version="${{ needs.bump.outputs.version }}"
          image="${{ env.IMAGE_BASE }}:$version"
          echo "Pulling $image ..."
          docker pull --platform linux/amd64 "$image"
          reported=$(docker run --rm --entrypoint python "$image" -c \
            'from ph_stocks_advisor.web.app import _app_version; print(_app_version())')
          echo "tag=$version  image_reports=$reported"
          if [ "$reported" != "$version" ]; then
            echo "::error::Version drift — image :$version reports '$reported'"
            exit 1
          fi
          echo "::notice::Verified $image reports version $reported"

      - name: Verify :latest reports the same version
        if: needs.changes.outputs.app == 'true' && needs.bump.outputs.version != ''
        run: |
          set -euo pipefail
          version="${{ needs.bump.outputs.version }}"
          docker pull --platform linux/amd64 "${{ env.IMAGE_BASE }}:latest"
          reported=$(docker run --rm --entrypoint python "${{ env.IMAGE_BASE }}:latest" -c \
            'from ph_stocks_advisor.web.app import _app_version; print(_app_version())')
          echo "latest reports=$reported (expected $version)"
          if [ "$reported" != "$version" ]; then
            echo "::error:::latest reports '$reported' but the tag is $version"
            exit 1
          fi

  deploy-azure:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [quality, unit-tests, integration-tests, changes]
    # deploy.sh --update rebuilds & pushes both images, so only run when an
    # image input or the prod compose changed — skip docs/test-only merges.
    if: >
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && (needs.changes.outputs.app == 'true'
          || needs.changes.outputs.admin == 'true'
          || needs.changes.outputs.deploy == 'true')
    environment: azure
    steps:
      - name: Check Azure secrets
        id: check
        run: |
          if [ -z "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.skip == 'false'

      - name: Azure Login
        if: steps.check.outputs.skip == 'false'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        if: steps.check.outputs.skip == 'false'
        run: ./infra/azure/deploy.sh --update
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'ph-stocks-advisor-rg' }}
          AZURE_APP_NAME: ${{ vars.AZURE_APP_NAME || 'phstocks' }}
          IMAGE_TAG: ${{ github.sha }}

      - name: Skipped
        if: steps.check.outputs.skip == 'true'
        run: echo "⏭ Azure deployment skipped — AZURE_CREDENTIALS secret not configured"

  # ── Deploy via Docker Compose over SSH ───────────────────────────────────
  deploy-ssh:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    needs: [quality, unit-tests, integration-tests, changes, build-images]
    # build-images may be skipped when nothing image-related changed; deploy
    # only when an image was actually rebuilt/pushed or the prod compose file
    # changed, and never when a required gate failed.
    if: >
      !cancelled()
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.quality.result == 'success'
      && needs.unit-tests.result == 'success'
      && needs.integration-tests.result == 'success'
      && (needs.build-images.result == 'success' || needs.changes.outputs.deploy == 'true')
    environment: production
    steps:
      - name: Check SSH secrets
        id: check
        run: |
          if [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH
        if: steps.check.outputs.skip == 'false'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            cd ${{ vars.DEPLOY_PATH || '~/ph-stocks-advisor' }}

            echo "▸ Pulling pre-built images from GHCR …"
            docker compose -f docker-compose.prod.yml pull

            echo "▸ Restarting services …"
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "▸ Cleaning up old images …"
            docker image prune -f

            echo "▸ Waiting for health check …"
            sleep 10
            curl -sf http://localhost:${WEB_PORT:-5000}/healthz || {
              echo "❌ Health check failed"
              docker compose -f docker-compose.prod.yml logs --tail=50 web
              exit 1
            }

            echo "✔ Deployment complete"

      - name: Skipped
        if: steps.check.outputs.skip == 'true'
        run: echo "⏭ SSH deployment skipped — DEPLOY_SSH_KEY secret not configured"
